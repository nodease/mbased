# Static-render placeholders only. This file must never be used for deployment.
storage:
  bucketName: "ci-static-render-placeholder"
  region: "region-ci-1"

egressProxy:
  enabled: true
  networkPolicy:
    authorizedSourceCidrs:
      - "192.168.0.0/16"

gateway:
  env:
    AUTH_LOGIN_TRUSTED_PROXY_CIDRS: "10.0.0.0/16"

postgresql:
  externalHost: "postgresql.ci.invalid"

worker:
  networkPolicy:
    externalDatabaseCidrs:
      - "10.0.0.0/16"
    externalRedisCidrs:
      - "10.0.0.0/16"

secrets:
  connectorTestAdmissionHmacKey: "ci-static-render-placeholder-32-bytes"
