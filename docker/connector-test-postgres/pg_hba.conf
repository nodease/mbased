# Connector demo PostgreSQL accepts local bootstrap administration only through
# the container Unix socket. Every TCP client must use TLS and SCRAM.
local   all             postgres                                trust
local   all             all                                     reject
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl connector_demo  connector_demo_user 0.0.0.0/0           scram-sha-256
hostssl connector_demo  connector_demo_user ::/0                scram-sha-256
hostssl all             postgres        0.0.0.0/0               scram-sha-256
hostssl all             postgres        ::/0                    scram-sha-256
hostssl all             all             0.0.0.0/0               reject
hostssl all             all             ::/0                    reject
