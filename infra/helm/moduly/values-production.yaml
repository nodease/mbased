# =============================================================================
# Moduly Helm Chart - Provider-neutral production reference
# =============================================================================
# Provider-neutral production reference. Operators must supply environment-specific
# storage, ingress, network, image, and secret values before deployment.
#
# Usage:
#   helm install moduly ./infra/helm/moduly \
#     -f values-production.yaml -f operator-values.yaml

# Global settings
global:
  imagePullPolicy: Always  # Always pull latest images in production
  storageClass: ""  # Use the cluster default unless the operator selects one.

# Intentionally incomplete until the operator supplies both coordinates.
# CLOUD renders fail closed when bucketName or region is empty.
storage:
  type: "CLOUD"
  bucketName: ""
  region: ""

egressProxy:
  enabled: true
  policyRevision: "proxy-v1"
  replicaCount: 2
  image:
    repository: ubuntu/squid
    tag: "6.6-24.04_edge"
    digest: "sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c"
    pullPolicy: IfNotPresent
  networkPolicy:
    enabled: true
    enforced: true
    enforcementPhase: "final"
    # Supply the exact pod CIDRs in operator-values.yaml.
    authorizedSourceCidrs: []
    # Override when the production cluster DNS endpoint is not in kube-system.
    dns:
      namespace: "kube-system"
      podSelectorLabels: {}

# =============================================================================
# Application Services
# =============================================================================

# Start production in disabled mode. Activate claim mode only after the
# migration-first rollout and legacy task drain gate have passed.
scheduleDispatch:
  mode: "disabled"

memoryPublicConversation:
  enabled: false
  purgeWorkerReady: false
  replayBackupErasureMode: "unconfirmed"
  capabilityHmacPrimaryVersion: ""
  replayEncryptionPrimaryVersion: ""

# Gateway (API Server)
gateway:
  enabled: true
  replicaCount: 2  # Higher replica count for production
  
  image:
    repository: ghcr.io/nodease/moduly-gateway
    tag: latest  # Use specific version tags in production
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8000
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  env:
    # External PostgreSQL configuration
    DB_HOST: "postgresql.example.invalid"
    DB_PORT: "5432"
    DB_NAME: "moduly"
    DB_USER: "postgres"
    # DB_PASSWORD is in secrets
    
    # Redis configuration
    REDIS_HOST: "redis-master.default.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    # REDIS_PASSWORD is in secrets
    # Required when ingress is enabled. Set this to the actual trusted proxy
    # CIDR; do not use a broad guessed network.
    AUTH_LOGIN_TRUSTED_PROXY_CIDRS: ""
    
    # CORS and Security
    CORS_ORIGINS: "https://nodease.example.invalid"
    # SECRET_KEY is in secrets
    
    # Sandbox configuration
    SANDBOX_URL: "http://{{ .Release.Name }}-sandbox:8194"
    # SANDBOX_API_KEY is in secrets
    
    # Encryption keys for external DB connections
    # MASTER_KEY and ENCRYPTION_KEY are in secrets
    
    # Google OAuth (optional)
    # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are in secrets
    
    # Node environment
    NODE_ENV: "production"
  
# The resource is rendered in the production reference. Apply the release's
# additive migration first; the init and worker bootstep fail closed until the
# migration and credential keyring are ready.
knowledgeWorker:
  enabled: true
  replicaCount: 2
  concurrency: 2

# Durable Knowledge ingestion recovery is part of the supported production
# worker contract. The chart rejects a worker-only deployment without Beat.
beat:
  enabled: true

# Worker (Workflow Engine)
worker:
  enabled: true
  replicaCount: 4  # More workers for production workload
  
  image:
    repository: ghcr.io/nodease/moduly-workflow-engine
    tag: latest
    pullPolicy: Always
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  env:
    # Database configuration
    DB_HOST: "postgresql.example.invalid"
    DB_PORT: "5432"
    DB_NAME: "moduly"
    DB_USER: "postgres"
    
    # Redis configuration
    REDIS_HOST: "redis-master.default.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    
    # Sandbox configuration
    SANDBOX_URL: "http://{{ .Release.Name }}-sandbox:8194"
    
  networkPolicy:
    enabled: true
    # Replace with the actual external dependency CIDR before deployment.
    externalDatabaseCidrs:
      - "10.0.0.0/16"
    externalRedisCidrs: []
    externalSandboxCidrs: []

# Logger (Logging System)
logger:
  enabled: true
  replicaCount: 2  # More replicas for production
  
  image:
    repository: ghcr.io/nodease/moduly-logger
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  env:
    # Database configuration
    DB_HOST: "postgresql.example.invalid"
    DB_PORT: "5432"
    DB_NAME: "moduly"
    DB_USER: "postgres"
    
    # Redis configuration
    REDIS_HOST: "redis-master.default.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_DB: "0"

# Frontend (Next.js Client)
frontend:
  enabled: true
  replicaCount: 3
  
  image:
    repository: ghcr.io/nodease/moduly-client
    tag: latest
    pullPolicy: Always
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  env:
    # Browser calls use same-origin /api through the public HTTPS ingress.
    NEXT_PUBLIC_API_URL: ""
    # Empty uses the chart template's release-aware internal Gateway URL.
    API_URL: ""

# Sandbox (Code Execution)
sandbox:
  enabled: true
  replicaCount: 3
  
  image:
    repository: ghcr.io/nodease/moduly-sandbox
    tag: latest
    pullPolicy: Always
  
  # NSJail security context
  securityContext:
    privileged: true
  
  service:
    type: ClusterIP
    port: 8194
  
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  probes:
    liveness:
      path: /v1/sandbox/health
    readiness:
      path: /v1/sandbox/health

  env:
    # Timezone
    TZ: "Asia/Seoul"

    # Worker Pool Settings
    SANDBOX_MIN_WORKERS: "2"
    SANDBOX_MAX_WORKERS: "8"
    SANDBOX_WORKER_IDLE_TIMEOUT: "30"

    # Dynamic Scaling (EMA)
    SANDBOX_SCALING_INTERVAL: "1"
    SANDBOX_EMA_ALPHA: "0.2"
    SANDBOX_TARGET_RPS_PER_WORKER: "2.0"
    SANDBOX_SCALE_DOWN_COOLDOWN: "30"
    SANDBOX_SCALE_DOWN_IDLE_TIME: "30"

    # Execution Limits
    SANDBOX_DEFAULT_TIMEOUT: "10"
    SANDBOX_MAX_TIMEOUT: "60"
    SANDBOX_MAX_MEMORY_MB: "128"

    # Queue Settings
    SANDBOX_MAX_QUEUE_SIZE: "1000"

    # Fair Scheduler
    SANDBOX_MAX_PER_TENANT: "3"
    SANDBOX_AGING_INTERVAL: "5"
    SANDBOX_AGING_THRESHOLD_LOW: "15"
    SANDBOX_AGING_THRESHOLD_NORMAL: "30"
    SANDBOX_QUEUE_CLEANUP_INTERVAL: "300"
    SANDBOX_QUEUE_IDLE_TIMEOUT: "600"
  
  networkPolicy:
    enabled: true

# =============================================================================
# Secrets Configuration
# =============================================================================
# IMPORTANT: In production, use an external secret manager.
# These should NOT be committed to git.

connectorTest:
  allowedPorts:
    - 5432

secrets:
  # Database password (from the operator-selected secret manager)
  dbPassword: ""  # Override with --set or external secrets
  
  # Redis password
  redisPassword: ""
  
  # JWT secret key
  secretKey: ""
  
  # Required HMAC key for connector test admission identity digests (32+ bytes).
  connectorTestAdmissionHmacKey: ""

  memoryPublicCapabilityHmacKey: ""
  memoryPublicCapabilityHmacKeys: ""
  memoryPublicReplayEncryptionKey: ""
  memoryPublicReplayEncryptionKeys: ""
  memoryPublicAdmissionHmacKey: ""

  # Master encryption keys
  masterKey: ""
  encryptionKey: ""
  mailCredentialEncryptionKeys: ""
  mailCredentialActiveKeyVersion: "v1"
  workflowNodeSecretEncryptionKeys: ""
  workflowNodeSecretActiveKeyVersion: "v1"
  llmCredentialEncryptionKeys: ""
  llmCredentialActiveKeyVersion: "v1"
  authLoginFingerprintKeys: ""  # Override with external secret
  
  # Sandbox API key
  sandboxApiKey: ""
  
  # Google OAuth
  googleClientId: ""
  googleClientSecret: ""

# =============================================================================
# PostgreSQL (disabled; configure an external service)
# =============================================================================
postgresql:
  enabled: false  # Configure an external PostgreSQL service.
  
  # External database configuration
  # Set these via --set flags or external secrets
  # externalHost: postgresql.example.invalid
  # externalPort: 5432
  # externalDatabase: moduly
  # externalUser: postgres
  # externalPassword: <from secrets>

# =============================================================================
# Redis (In-cluster deployment)
# =============================================================================
redis:
  enabled: true  # Using Redis deployed within the cluster
  
  architecture: standalone  # Using standalone for now, can upgrade to "replication" for HA
  
  auth:
    enabled: true
    password: ""  # Override with --set or external secrets
  
  master:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  
  # To use external Redis, disable this dependency and configure each service's
  # Redis endpoint and network policy explicitly.

# =============================================================================
# Ingress (operator configured)
# =============================================================================
ingress:
  enabled: false  # Operator must explicitly configure ingress.
  publicChatTimeoutSeconds: 610
  className: ""
  annotations: {}
  hosts: []
  tls: []

# =============================================================================
# Shared workload identity for Gateway, Workflow Worker and Knowledge Worker.
# Provider-specific annotations are operator supplied here.
# =============================================================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================================================
# Pod Security Context
# =============================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

# =============================================================================
# Node Selection & Scheduling
# =============================================================================
nodeSelector:
  # Example: Use specific node groups
  # node.kubernetes.io/instance-type: t3.medium

tolerations: []
  # Example: Tolerate specific taints
  # - key: "workload"
  #   operator: "Equal"
  #   value: "api"
  #   effect: "NoSchedule"

affinity:
  # Example: Pod anti-affinity for HA
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - moduly
        topologyKey: kubernetes.io/hostname

# =============================================================================
# Autoscaling (Optional)
# =============================================================================
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
