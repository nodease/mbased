{{- if and .Values.egressProxy.enabled .Values.egressProxy.networkPolicy.enabled .Values.egressProxy.networkPolicy.enforced }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moduly.fullname" . }}-egress-proxy-ingress
  labels:
    {{- include "moduly.componentLabels" (dict "component" "egress-proxy" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moduly.componentSelectorLabels" (dict "component" "egress-proxy" "context" .) | nindent 6 }}
      nodease.io/egress-mode: proxy-v1
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "gateway" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "knowledge-worker" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3128
    - from:
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "worker" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3129
    - from:
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "gateway" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "knowledge-worker" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "worker" "context" .) | nindent 14 }}
              {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3130
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moduly.fullname" . }}-gateway-proxy-only-egress
  labels:
    {{- include "moduly.componentLabels" (dict "component" "gateway" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moduly.componentSelectorLabels" (dict "component" "gateway" "context" .) | nindent 6 }}
      {{- include "moduly.egressWorkloadSelectorLabel" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- include "moduly.dnsEgressPeer" . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "egress-proxy" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3128
        - protocol: TCP
          port: 3130
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: {{ include "moduly.postgresql.port" . }}
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.sandbox.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "moduly.componentSelectorLabels" (dict "component" "sandbox" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8194
    {{- end }}
    {{- range .Values.worker.networkPolicy.externalDatabaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ include "moduly.postgresql.port" $ }}
    {{- end }}
    {{- range .Values.worker.networkPolicy.externalRedisCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- range .Values.worker.networkPolicy.externalSandboxCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8194
    {{- end }}
---
