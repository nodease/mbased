{{- if .Values.ingress.enabled }}
{{- $fullName := include "moduly.fullname" . -}}
{{- $gatewayServiceName := printf "%s-gateway" $fullName -}}
{{- $frontendServiceName := printf "%s-frontend" $fullName -}}
{{- $publicChatTimeoutSeconds := int (required "ingress.publicChatTimeoutSeconds is required" .Values.ingress.publicChatTimeoutSeconds) -}}
{{- if le $publicChatTimeoutSeconds 600 -}}
{{- fail "ingress.publicChatTimeoutSeconds must be greater than the 600 second public request deadline" -}}
{{- end -}}
{{- $proxyTimeout := printf "%d" $publicChatTimeoutSeconds -}}
{{- $requiredAnnotations := dict
  "nginx.ingress.kubernetes.io/proxy-read-timeout" $proxyTimeout
  "nginx.ingress.kubernetes.io/proxy-send-timeout" $proxyTimeout
-}}
{{- $annotations := mergeOverwrite
  (deepCopy (.Values.ingress.annotations | default dict))
  $requiredAnnotations
-}}
apiVersion: {{ include "moduly.ingress.apiVersion" . }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "moduly.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .backend "gateway" }}{{ $gatewayServiceName }}{{ else if eq .backend "frontend" }}{{ $frontendServiceName }}{{ else }}{{ .backend }}{{ end }}
                port:
                  {{- if .port }}
                  number: {{ .port }}
                  {{- else if eq .backend "gateway" }}
                  number: {{ $.Values.gateway.service.port }}
                  {{- else if eq .backend "frontend" }}
                  number: {{ $.Values.frontend.service.port }}
                  {{- else }}
                  number: 80
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
