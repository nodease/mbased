{{- if and .Values.sandbox.enabled .Values.sandbox.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "moduly.fullname" . }}-sandbox-egress
  labels:
    {{- include "moduly.componentLabels" (dict "component" "sandbox" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "moduly.componentSelectorLabels" (dict "component" "sandbox" "context" .) | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8194
  
  egress:
    # Operator-owned cluster DNS only.
    - to:
        {{- include "moduly.dnsEgressPeer" . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # All other destinations remain denied.
{{- end }}
