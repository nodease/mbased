{{- include "moduly.validateLoginTrustedProxy" . }}
{{- include "moduly.validateStorage" . }}
{{- include "moduly.validateEgressProxy" . }}
{{- $storageType := include "moduly.storageType" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moduly.configMapName" . }}
  labels:
    {{- include "moduly.labels" . | nindent 4 }}
data:
  # Database configuration (non-sensitive)
  DB_HOST: {{ include "moduly.postgresql.host" . | quote }}
  DB_PORT: {{ include "moduly.postgresql.port" . | quote }}
  DB_NAME: {{ .Values.postgresql.auth.database | default "moduly" | quote }}
  DB_USER: {{ .Values.postgresql.auth.username | default "moduly" | quote }}
  
  # Redis configuration (non-sensitive)
  REDIS_HOST: {{ include "moduly.redis.host" . | quote }}
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  AUTH_LOGIN_LIMITER_REDIS_DB: {{ .Values.gateway.env.AUTH_LOGIN_LIMITER_REDIS_DB | default "2" | quote }}
  AUTH_LOGIN_LIMITER_POLICY_VERSION: {{ .Values.gateway.env.AUTH_LOGIN_LIMITER_POLICY_VERSION | default "v1" | quote }}
  AUTH_LOGIN_FINGERPRINT_PRIMARY_VERSION: {{ .Values.gateway.env.AUTH_LOGIN_FINGERPRINT_PRIMARY_VERSION | default "v1" | quote }}
  AUTH_LOGIN_TRUSTED_PROXY_CIDRS: {{ .Values.gateway.env.AUTH_LOGIN_TRUSTED_PROXY_CIDRS | default "" | quote }}
  # Public Chatbot client-history rollout mode
  PUBLIC_CHAT_CONVERSATION_ROLLOUT_MODE: {{ .Values.gateway.env.PUBLIC_CHAT_CONVERSATION_ROLLOUT_MODE | default "compatibility" | quote }}

  
  # Celery-specific Redis DB configuration (I/O 경합 방지)
  REDIS_BROKER_DB: "0"     # Celery message queue
  REDIS_BACKEND_DB: "1"    # Celery result backend
  
  # Storage configuration
  STORAGE_TYPE: {{ $storageType | quote }}
  {{- if eq $storageType "CLOUD" }}
  S3_BUCKET_NAME: {{ .Values.storage.bucketName | trim | quote }}
  AWS_REGION: {{ .Values.storage.region | trim | quote }}
  {{- end }}

  # App authentication secret lifecycle remains disabled until every Gateway
  # pod is running the verifier-aware revision.
  APP_AUTH_SECRET_LIFECYCLE_MODE: {{ .Values.gateway.env.APP_AUTH_SECRET_LIFECYCLE_MODE | default "disabled" | quote }}
  
  # CORS configuration
  CORS_ORIGINS: {{ required "gateway.env.CORS_ORIGINS is required" .Values.gateway.env.CORS_ORIGINS | quote }}
  
  # Sandbox configuration
  SANDBOX_URL: {{ printf "http://%s-sandbox:%d" (include "moduly.fullname" .) (.Values.sandbox.service.port | int) | quote }}
  
  # Node environment
  NODE_ENV: {{ .Values.gateway.env.NODE_ENV | default "production" | quote }}
  
  # Next.js API URL (for frontend)
  {{- if .Values.frontend.env.NEXT_PUBLIC_API_URL }}
  NEXT_PUBLIC_API_URL: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL | quote }}
  {{- end }}
  {{- if .Values.frontend.env.API_URL }}
  API_URL: {{ .Values.frontend.env.API_URL | quote }}
  {{- else }}
  API_URL: {{ printf "http://%s-gateway:%d" (include "moduly.fullname" .) (.Values.gateway.service.port | int) | quote }}
  {{- end }}
  
  # Timezone
  TZ: {{ .Values.sandbox.env.TZ | default "Asia/Seoul" | quote }}
