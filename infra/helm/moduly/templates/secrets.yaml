{{- $connectorTestAdmissionHmacKey := required "secrets.connectorTestAdmissionHmacKey is required (32+ bytes)" .Values.secrets.connectorTestAdmissionHmacKey -}}
{{- if lt (len $connectorTestAdmissionHmacKey) 32 -}}
{{- fail "secrets.connectorTestAdmissionHmacKey must contain at least 32 bytes" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moduly.secretName" . }}
  labels:
    {{- include "moduly.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password
  # Example: moduly123
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  
  # Redis password
  # Example: redis123
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  
  # JWT secret key
  # Example: your-super-secret-jwt-key-change-in-production
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}

  AUTH_LOGIN_FINGERPRINT_KEYS: {{ .Values.secrets.authLoginFingerprintKeys | b64enc | quote }}
  
  # Connector test admission HMAC key. Keep separate from auth/session keys.
  CONNECTOR_TEST_ADMISSION_HMAC_KEY: {{ $connectorTestAdmissionHmacKey | b64enc | quote }}

  {{- if .Values.memoryPublicConversation.enabled }}
  {{- if .Values.secrets.memoryPublicCapabilityHmacKeys }}
  MEMORY_PUBLIC_CAPABILITY_HMAC_KEYS: {{ .Values.secrets.memoryPublicCapabilityHmacKeys | b64enc | quote }}
  {{- else }}
  MEMORY_PUBLIC_CAPABILITY_HMAC_KEY: {{ required "secrets.memoryPublicCapabilityHmacKey is required when public memory is enabled" .Values.secrets.memoryPublicCapabilityHmacKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.memoryPublicReplayEncryptionKeys }}
  MEMORY_PUBLIC_REPLAY_ENCRYPTION_KEYS: {{ .Values.secrets.memoryPublicReplayEncryptionKeys | b64enc | quote }}
  {{- else }}
  MEMORY_PUBLIC_REPLAY_ENCRYPTION_KEY: {{ required "secrets.memoryPublicReplayEncryptionKey is required when public memory is enabled" .Values.secrets.memoryPublicReplayEncryptionKey | b64enc | quote }}
  {{- end }}
  MEMORY_PUBLIC_ADMISSION_HMAC_KEY: {{ required "secrets.memoryPublicAdmissionHmacKey is required when public memory is enabled" .Values.secrets.memoryPublicAdmissionHmacKey | b64enc | quote }}
  MEMORY_CONTENT_ENCRYPTION_KEYS: {{ required "secrets.memoryContentEncryptionKeys is required when public memory is enabled" .Values.secrets.memoryContentEncryptionKeys | b64enc | quote }}
  MEMORY_CONTENT_DIGEST_HMAC_KEY: {{ required "secrets.memoryContentDigestHmacKey is required when public memory is enabled" .Values.secrets.memoryContentDigestHmacKey | b64enc | quote }}
  {{- if .Values.memoryPublicConversation.runtimeEnabled }}
  MEMORY_RUNTIME_ADMISSION_HMAC_KEYS: {{ required "secrets.memoryRuntimeAdmissionHmacKeys is required when public memory runtime is enabled" .Values.secrets.memoryRuntimeAdmissionHmacKeys | b64enc | quote }}
  {{- end }}
  {{- end }}

  # Master encryption key (generate with: openssl rand -base64 32)
  # Example: <GENERATE_WITH_OPENSSL_RAND_BASE64_32>
  {{- if .Values.secrets.masterKey }}
  MASTER_KEY: {{ .Values.secrets.masterKey | b64enc | quote }}
  {{- else }}
  # MASTER_KEY: <REQUIRED_FOR_PRODUCTION>
  {{- end }}

  # Versioned Mail credential keyring. JSON object keyed by version.
  {{- if .Values.secrets.mailCredentialEncryptionKeys }}
  MAIL_CREDENTIAL_ENCRYPTION_KEYS: {{ .Values.secrets.mailCredentialEncryptionKeys | b64enc | quote }}
  {{- end }}

  # Versioned Workflow node secret keyring. JSON object keyed by version.
  {{- if .Values.secrets.workflowNodeSecretEncryptionKeys }}
  WORKFLOW_NODE_SECRET_ENCRYPTION_KEYS: {{ .Values.secrets.workflowNodeSecretEncryptionKeys | b64enc | quote }}
  {{- end }}

  # Versioned LLM credential keyring. JSON object keyed by version.
  {{- if .Values.secrets.llmCredentialEncryptionKeys }}
  LLM_CREDENTIAL_ENCRYPTION_KEYS: {{ .Values.secrets.llmCredentialEncryptionKeys | b64enc | quote }}
  {{- end }}
  
  # Encryption key (generate with: openssl rand -base64 32)
  # Example: <GENERATE_WITH_OPENSSL_RAND_BASE64_32>
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- else }}
  # ENCRYPTION_KEY: <REQUIRED_FOR_PRODUCTION>
  {{- end }}
  
  # Sandbox API key
  # Example: Modulycallsandbox306
  SANDBOX_API_KEY: {{ .Values.secrets.sandboxApiKey | b64enc | quote }}
  
  # Google OAuth Client ID (optional)
  # Example: <YOUR_GOOGLE_CLIENT_ID>.apps.googleusercontent.com
  {{- if .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | b64enc | quote }}
  {{- else }}
  # GOOGLE_CLIENT_ID: <OPTIONAL_FOR_GOOGLE_LOGIN>
  {{- end }}
  
  # Google OAuth Client Secret (optional)
  # Example: <YOUR_GOOGLE_CLIENT_SECRET>
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | b64enc | quote }}
  {{- else }}
  # GOOGLE_CLIENT_SECRET: <OPTIONAL_FOR_GOOGLE_LOGIN>
  {{- end }}
  
  # Llama Cloud API key (optional)
  # Example: <YOUR_LLAMA_CLOUD_API_KEY>
  {{- if .Values.secrets.llamaCloudApiKey }}
  LLAMA_CLOUD_API_KEY: {{ .Values.secrets.llamaCloudApiKey | b64enc | quote }}
  {{- else }}
  # LLAMA_CLOUD_API_KEY: <OPTIONAL_FOR_LLAMA_CLOUD>
  {{- end }}

---
# Note: In production, consider using external secrets management:
# - AWS Secrets Manager with External Secrets Operator
# - HashiCorp Vault
# - Sealed Secrets
# 
# To set secrets via Helm:
#   helm install moduly ./infra/helm/moduly \
#     --set secrets.dbPassword=<YOUR_DB_PASSWORD> \
#     --set secrets.redisPassword=<YOUR_REDIS_PASSWORD> \
#     --set secrets.secretKey=<YOUR_JWT_SECRET> \
#     --set secrets.connectorTestAdmissionHmacKey=<YOUR_32_BYTE_KEY>
