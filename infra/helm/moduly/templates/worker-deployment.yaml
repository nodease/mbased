{{- if .Values.worker.enabled }}
{{- $storageType := include "moduly.storageType" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moduly.fullname" . }}-worker
  labels:
    {{- include "moduly.componentLabels" (dict "component" "worker" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "moduly.componentSelectorLabels" (dict "component" "worker" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moduly.componentSelectorLabels" (dict "component" "worker" "context" .) | nindent 8 }}
        {{- if .Values.egressProxy.enabled }}
        nodease.io/egress-mode: proxy-v1
        {{- end }}
      annotations:
        nodease.io/egress-enforcement-phase: {{ .Values.egressProxy.networkPolicy.enforcementPhase | quote }}
        nodease.io/schedule-dispatch-fingerprint: {{ include "moduly.scheduleDispatchFingerprint" . | quote }}
        checksum/config: {{ toYaml .Values | sha256sum }}
        checksum/secret: {{ toYaml .Values.secrets | sha256sum }}
    spec:
      serviceAccountName: {{ include "moduly.serviceAccountName" . }}
      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        env:
        {{- include "moduly.outboundProxyEnv" (dict "context" . "port" .Values.egressProxy.service.httpCompatiblePort) | nindent 8 }}
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: NODE_ENV
        # Database configuration (from ConfigMap)
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: DB_PASSWORD
        
        # Redis configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: REDIS_PASSWORD

        {{- include "moduly.scheduleDispatchEnv" . | nindent 8 }}
        {{- if .Values.memoryPublicConversation.runtimeEnabled }}
        - name: MEMORY_RUNTIME_MINIMUM_WORKER_CAPABILITY
          value: {{ .Values.memoryPublicConversation.runtimeMinimumWorkerCapability | quote }}
        - name: MEMORY_CONTENT_ENCRYPTION_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: MEMORY_CONTENT_ENCRYPTION_KEYS
        - name: MEMORY_CONTENT_ENCRYPTION_PRIMARY_VERSION
          value: {{ required "memoryPublicConversation.contentEncryptionPrimaryVersion is required when public memory runtime is enabled" .Values.memoryPublicConversation.contentEncryptionPrimaryVersion | quote }}
        - name: MEMORY_CONTENT_DIGEST_HMAC_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: MEMORY_CONTENT_DIGEST_HMAC_KEY
        - name: MEMORY_RUNTIME_PROVIDER_INPUT_TOKEN_CAP
          value: {{ required "memoryPublicConversation.providerInputTokenCap is required when public memory runtime is enabled" .Values.memoryPublicConversation.providerInputTokenCap | quote }}
        - name: MEMORY_RUNTIME_PROVIDER_OUTPUT_TOKEN_CAP
          value: {{ required "memoryPublicConversation.providerOutputTokenCap is required when public memory runtime is enabled" .Values.memoryPublicConversation.providerOutputTokenCap | quote }}
        - name: MEMORY_RUNTIME_PROVIDER_COST_CAP_MICROUSD
          value: {{ required "memoryPublicConversation.providerCostCapMicrousd is required when public memory runtime is enabled" .Values.memoryPublicConversation.providerCostCapMicrousd | quote }}
        {{- end }}
        
        # Sandbox configuration (for Code node execution)
        - name: SANDBOX_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: SANDBOX_URL
        
        # Storage configuration (for file processing)
        - name: STORAGE_TYPE
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: STORAGE_TYPE
        {{- if eq $storageType "CLOUD" }}
        - name: S3_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: S3_BUCKET_NAME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: AWS_REGION
        {{- end }}
        
        # Encryption key (from K8s worker config)
        {{- if .Values.secrets.encryptionKey }}
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: ENCRYPTION_KEY
        {{- end }}
        {{- if .Values.secrets.mailCredentialEncryptionKeys }}
        - name: MAIL_CREDENTIAL_ENCRYPTION_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: MAIL_CREDENTIAL_ENCRYPTION_KEYS
        - name: MAIL_CREDENTIAL_ACTIVE_KEY_VERSION
          value: {{ .Values.secrets.mailCredentialActiveKeyVersion | default "v1" | quote }}
        {{- end }}
        {{- if .Values.secrets.workflowNodeSecretEncryptionKeys }}
        - name: WORKFLOW_NODE_SECRET_ENCRYPTION_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: WORKFLOW_NODE_SECRET_ENCRYPTION_KEYS
        - name: WORKFLOW_NODE_SECRET_ACTIVE_KEY_VERSION
          value: {{ .Values.secrets.workflowNodeSecretActiveKeyVersion | default "v1" | quote }}
        {{- end }}
        {{- if .Values.secrets.llmCredentialEncryptionKeys }}
        - name: LLM_CREDENTIAL_ENCRYPTION_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ include "moduly.secretName" . }}
              key: LLM_CREDENTIAL_ENCRYPTION_KEYS
        - name: LLM_CREDENTIAL_ACTIVE_KEY_VERSION
          value: {{ .Values.secrets.llmCredentialActiveKeyVersion | default "v1" | quote }}
        {{- end }}
        
        # Celery-specific Redis configuration
        - name: REDIS_BROKER_DB
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: REDIS_BROKER_DB
        - name: REDIS_BACKEND_DB
          valueFrom:
            configMapKeyRef:
              name: {{ include "moduly.configMapName" . }}
              key: REDIS_BACKEND_DB
        
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        
        # Note: Worker communicates via Redis queue, no HTTP endpoints
        # Health checks are not needed (no HTTP service)
{{- end }}
