http_port 3128 name=https_only
http_port 3129 name=http_compatible
http_port 3130 name=connector_tcp
pid_filename none
visible_hostname nodease-egress-proxy
include /etc/squid/authorized-sources.conf
include /etc/squid/connector-ports.conf

acl https_only_listener myportname https_only
acl http_compatible_listener myportname http_compatible
acl connector_tcp_listener myportname connector_tcp
acl CONNECT method CONNECT
acl SSL_ports port 443
acl HTTP_ports port 80
acl IMAP_ports port 143 993
acl CONNECT_ports port 143 443 993
acl Safe_ports port 80
acl Safe_ports port 143
acl Safe_ports port 443
acl Safe_ports port 993

# Keep this registry aligned with the application egress guard and the
# proxy NetworkPolicy. A single matching DNS answer denies the whole request.
acl blocked_destination dst 0.0.0.0/8
acl blocked_destination dst 10.0.0.0/8
acl blocked_destination dst 100.64.0.0/10
acl blocked_destination dst 127.0.0.0/8
acl blocked_destination dst 169.254.0.0/16
acl blocked_destination dst 172.16.0.0/12
acl blocked_destination dst 192.0.0.0/24
acl blocked_destination dst 192.0.2.0/24
acl blocked_destination dst 192.88.99.0/24
acl blocked_destination dst 192.168.0.0/16
acl blocked_destination dst 198.18.0.0/15
acl blocked_destination dst 198.51.100.0/24
acl blocked_destination dst 203.0.113.0/24
acl blocked_destination dst 224.0.0.0/4
acl blocked_destination dst 240.0.0.0/4
acl blocked_destination dst ::/96
acl blocked_destination dst ::ffff:0:0/96
acl blocked_destination dst 64:ff9b::/96
acl blocked_destination dst 64:ff9b:1::/48
acl blocked_destination dst 100::/64
acl blocked_destination dst 2001::/23
acl blocked_destination dst 2001:db8::/32
acl blocked_destination dst 2002::/16
acl blocked_destination dst 3ffe::/16
acl blocked_destination dst 3fff::/20
acl blocked_destination dst 5f00::/16
acl blocked_destination dst fc00::/7
acl blocked_destination dst fe80::/10
acl blocked_destination dst fec0::/10
acl blocked_destination dst ff00::/8

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_store_log none
cache_log /dev/null
logfile_rotate 0

connect_timeout 10 seconds
positive_dns_ttl 60 seconds
negative_dns_ttl 5 seconds
request_timeout 30 seconds
read_timeout 2 minutes
pconn_lifetime 2 minutes
client_lifetime 5 minutes
shutdown_lifetime 5 seconds
half_closed_clients off
forwarded_for delete
httpd_suppress_version_string on
icp_port 0

http_access deny !authorized_source
http_access deny manager
http_access deny CONNECT !CONNECT_ports
http_access deny !Safe_ports
http_access deny blocked_destination
http_access allow authorized_source https_only_listener CONNECT SSL_ports
http_access allow workflow_http_source http_compatible_listener CONNECT SSL_ports
http_access allow workflow_http_source http_compatible_listener CONNECT IMAP_ports
http_access allow workflow_http_source http_compatible_listener !CONNECT HTTP_ports
http_access allow authorized_source connector_tcp_listener CONNECT CONNECTOR_ports
http_access deny all
